{% load frontend %}{% frontend_assets as assets %}<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#244b3d">
<!-- Added to a homescreen, this runs without browser chrome. There is one
     page and no navigation, so nothing needs an address bar. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="robots" content="noindex, nofollow">
<title>Soares-Johnson Budget</title>
{% for href in assets.css %}<link rel="stylesheet" href="{{ href }}">{% endfor %}
</head>
<body>
<div id="root"></div>
<script type="module" src="{{ assets.js }}"></script>
</body>
</html>
